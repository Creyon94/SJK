[package]
name = "sjk-gpu-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The graphics card's video memory, read from DXGI behind a safe API"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
] }

# The second crate allowed `unsafe` (after sjk-mediafoundation): every DXGI call is
# a COM call. Each block says why it is sound (undocumented_unsafe_blocks); the rest
# of the workspace keeps `unsafe_code = "forbid"`.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
