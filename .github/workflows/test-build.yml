name: Test build

# A Windows package of a work branch to try before it is merged: every push to a
# `claude/` branch, or any branch on demand. Download it from the run's artifacts.
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - name: Preserve source and embedded shader line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-build-x86_64-pc-windows-msvc
      - name: Build optimized client and dedicated server
        run: cargo build --locked --release --target x86_64-pc-windows-msvc -p sjk-viewer -p sjk-dedicated
      - name: Package and smoke-check extracted executables
        run: >-
          python scripts/package_client.py
          --source . --target x86_64-pc-windows-msvc
          --platform windows-x64 --output dist --smoke-check
      - uses: actions/upload-artifact@v7
        with:
          name: SJK-windows-x64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
