<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Sol JK emblem">
  <defs>
    <radialGradient id="sun" cx="42%" cy="40%" r="62%">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset=".45" stop-color="#f2c45c"/>
      <stop offset="1" stop-color="#b8731c"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8d4ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#e8f5ff"/>
      <stop offset="1" stop-color="#a8d4ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- outer ring: a broken orbit, drawn for SJK -->
  <g fill="none" stroke="#a8cfff" stroke-width="1.6" stroke-linecap="round" opacity=".85">
    <path d="M60 8a52 52 0 0 1 49.4 35.9"/>
    <path d="M111.6 56a52 52 0 0 1-21.2 46.1"/>
    <path d="M78.9 108.5a52 52 0 0 1-56.6-12.3"/>
    <path d="M14.4 85.4A52 52 0 0 1 9 50"/>
    <path d="M14.8 33.7A52 52 0 0 1 44 10.5"/>
  </g>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#e8b84a" stroke-width=".8" stroke-dasharray="2 5" opacity=".7"/>
  <!-- the sun -->
  <circle cx="60" cy="60" r="27" fill="url(#sun)"/>
  <!-- a light blade crossing the sun -->
  <rect x="8" y="58.6" width="104" height="2.8" rx="1.4" fill="url(#blade)" transform="rotate(-24 60 60)"/>
</svg>
